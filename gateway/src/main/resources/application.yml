server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import: optional:file:.env

  cloud:
    gateway:
      server.webmvc.routes:
        - id: enhancement_service
          uri: http://localhost:8086
          predicates:
            - "Path=/api/publications/enhance"
            - "Method=POST"
          filters:
            - "RewritePath=/api/publications/(?<segment>.*), /api/v1/publications/${segment}"

        - id: aggregator_service
          uri: http://localhost:8083
          predicates:
            - "Path=/api/publications/{hash}"
            - "Method=GET"
          filters:
            - "RewritePath=/api/publications/(?<segment>.*), /api/v1/publications/${segment}"

        - id: metadata_service
          uri: http://localhost:8082
          predicates:
            - "Path=/api/publications/metadata/**"
            - "Method=GET,PUT"
          filters:
            - "RewritePath=/api/publications/(?<segment>.*), /api/v1/publications/${segment}"

        - id: storage_service
          uri: http://localhost:8081
          predicates:
            - "Path=/api/publications/**"
            - "Method=GET,POST"
          filters:
            - "RewritePath=/api/publications/(?<segment>.*), /api/v1/publications/${segment}"

        # API documentation
        - id: docs_storage
          uri: http://localhost:8081
          predicates:
            - "Path=/docs/storage/v3/api-docs/**"
          filters:
            - RewritePath=/docs/storage/(?<segment>.*), /${segment}

        - id: docs_metadata
          uri: http://localhost:8082
          predicates:
            - "Path=/docs/metadata/v3/api-docs/**"
          filters:
            - RewritePath=/docs/metadata/(?<segment>.*), /${segment}

        - id: docs_aggregator
          uri: http://localhost:8083
          predicates:
            - "Path=/docs/aggregator/v3/api-docs/**"
          filters:
            - RewritePath=/docs/aggregator/(?<segment>.*), /${segment}

        - id: docs_enhancement
          uri: http://localhost:8086
          predicates:
            - "Path=/docs/enhancement/v3/api-docs/**"
          filters:
            - RewritePath=/docs/enhancement/(?<segment>.*), /${segment}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Storage Service
        url: /docs/storage/v3/api-docs
      - name: Metadata Service
        url: /docs/metadata/v3/api-docs
      - name: Aggregator Service
        url: /docs/aggregator/v3/api-docs
      - name: Enhancement Service
        url: /docs/enhancement/v3/api-docs
  api-docs:
    path: /v3/api-docs
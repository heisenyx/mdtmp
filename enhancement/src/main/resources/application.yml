server:
  port: 8085

spring:
  application:
    name: enhancement-service
  config:
    import: optional:file:.env[.properties]

  ai:
    ollama:
      chat:
        model: ${CHAT_MODEL:gemma3:4b}
        options:
          temperature: 0.7
          frequency-penalty: 0.5
          presence-penalty: 1
          max-tokens: 128000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs